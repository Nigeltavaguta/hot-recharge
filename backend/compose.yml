services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotrecharge
      POSTGRES_USER: hotrecharge
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hot-recharge-db:/var/lib/postgresql/data
volumes:
  hot-recharge-db:
